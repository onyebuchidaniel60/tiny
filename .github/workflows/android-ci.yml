name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      distribute:
        description: Upload the debug APK to Firebase App Distribution (requires approved testers)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Materialize Firebase client config (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Firebase client config materialized for this build."
          else
            echo "No Firebase client config secret; building local/mock preview."
          fi

      - name: Materialize stable debug keystore (optional)
        env:
          TINY_DEBUG_KEYSTORE_BASE64: ${{ secrets.TINY_DEBUG_KEYSTORE_BASE64 }}
          TINY_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.TINY_DEBUG_KEYSTORE_PASSWORD }}
          TINY_DEBUG_KEY_ALIAS: ${{ secrets.TINY_DEBUG_KEY_ALIAS }}
          TINY_DEBUG_KEY_PASSWORD: ${{ secrets.TINY_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$TINY_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p .ci
            printf '%s' "$TINY_DEBUG_KEYSTORE_BASE64" | base64 --decode > .ci/tiny-debug.keystore
            {
              echo "TINY_DEBUG_KEYSTORE_PATH=$PWD/.ci/tiny-debug.keystore"
              echo "TINY_DEBUG_KEYSTORE_PASSWORD=${TINY_DEBUG_KEYSTORE_PASSWORD:-android}"
              echo "TINY_DEBUG_KEY_ALIAS=${TINY_DEBUG_KEY_ALIAS:-androiddebugkey}"
              echo "TINY_DEBUG_KEY_PASSWORD=${TINY_DEBUG_KEY_PASSWORD:-android}"
            } >> "$GITHUB_ENV"
            echo "Stable debug signing materialized (not printed)."
          else
            echo "No stable debug keystore secret; using the runner's default debug key."
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Translation, string and canonical-dataset guards
        run: |
          node tools/generate-i18n.mjs --check
          node tools/check-ui-strings.mjs
          node tools/check-canonical-dataset.mjs

      - name: Functions install and tests
        run: |
          if [ -f functions/package.json ]; then
            cd functions
            npm ci
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          fi

      - name: Android lint, unit tests and debug APK
        run: ./gradlew lint testDevDebugUnitTest assembleDevDebug --stacktrace

      - name: Verify APK signature and alignment
        run: |
          mkdir -p artifacts
          APK=$(find app/build/outputs/apk/dev/debug -name '*.apk' | head -n 1)
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tee artifacts/zipalign.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee artifacts/apk-signing.txt
          {
            echo "apk=$APK"
            echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "bytes=$(stat -c%s "$APK")"
          } | tee artifacts/apk-summary.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tiny-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-test-reports
          path: |
            app/build/reports/**
            functions/coverage/**
            artifacts/*.txt
          if-no-files-found: warn
          retention-days: 14

  rules-tests:
    name: Firestore rules (emulator)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run Firestore rules tests in emulator
        run: |
          npx --yes firebase-tools@15.14.0 emulators:exec \
            --only firestore \
            --project demo-tiny-rules \
            "npm --prefix functions run test:rules"

      - name: Run callable, webhook, scheduler and sync E2E in emulator
        run: |
          npx --yes firebase-tools@15.14.0 emulators:exec \
            --only firestore \
            --project demo-tiny-e2e \
            "npm --prefix functions run test:emulator"

  instrumentation-tests:
    name: Compose instrumentation
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose instrumentation journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDevDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-instrumentation-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

  emulator-smoke:
    name: Emulator smoke (manual)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: tiny-dev-debug-apk
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch emulator and capture first screen
        env:
          TINY_SMOKE_TEST_AUTH: "true"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash tools/android-emulator-smoke.sh artifacts/app-dev-debug.apk

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-emulator-evidence
          path: artifacts/emulator
          if-no-files-found: warn
          retention-days: 14

  distribute:
    name: Firebase App Distribution (manual)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.distribute && vars.FIREBASE_ANDROID_APP_ID != ''
    runs-on: ubuntu-24.04
    environment: distribution
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: tiny-dev-debug-apk
          path: artifacts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Upload to Firebase App Distribution
        run: |
          npx --yes firebase-tools@15.14.0 appdistribution:distribute \
            artifacts/app-dev-debug.apk \
            --app "${{ vars.FIREBASE_ANDROID_APP_ID }}" \
            --groups "${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}" \
            --release-notes "Tiny preview build ${{ github.run_number }} (${GITHUB_SHA::7})"
