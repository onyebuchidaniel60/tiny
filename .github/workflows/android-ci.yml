name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Functions install and tests
        run: |
          if [ -f functions/package.json ]; then
            cd functions
            npm ci
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          fi

      - name: Android lint, unit tests and debug APK
        run: ./gradlew lint testDevDebugUnitTest assembleDevDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tiny-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-test-reports
          path: |
            app/build/reports/**
            functions/coverage/**
          if-no-files-found: warn
          retention-days: 14

  distribute:
    name: Firebase App Distribution (manual)
    needs: build
    if: github.event_name == 'workflow_dispatch' && vars.FIREBASE_ANDROID_APP_ID != ''
    runs-on: ubuntu-24.04
    environment: distribution
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: tiny-dev-debug-apk
          path: artifacts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Upload to Firebase App Distribution
        run: |
          npx --yes firebase-tools@15.14.0 appdistribution:distribute \
            artifacts/app-dev-debug.apk \
            --app "${{ vars.FIREBASE_ANDROID_APP_ID }}" \
            --groups "${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}" \
            --release-notes "Tiny preview build ${{ github.run_number }} (${GITHUB_SHA::7})"
