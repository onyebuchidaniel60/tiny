name: Firebase AI smoke (manual, private build)

# This workflow builds an ephemeral debug APK with a registered App Check
# debug token and runs one live Firebase AI Logic test. The APK is never
# uploaded. Reports contain no token material.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-smoke:
    name: Live AI Logic (private debug build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Materialize Firebase client config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Materialize App Check debug token (ephemeral)
        env:
          FIREBASE_APP_CHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APP_CHECK_DEBUG_TOKEN }}
        run: |
          test -n "$FIREBASE_APP_CHECK_DEBUG_TOKEN"
          mkdir -p app/src/debug/res/values
          cat > app/src/debug/res/values/firebase_app_check_debug.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firebase_app_check_debug_token" translatable="false">${FIREBASE_APP_CHECK_DEBUG_TOKEN}</string>
          </resources>
          EOF

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run live AI Logic test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ng.tiny.education.AiLogicLiveTest --stacktrace

      - name: Upload AI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-firebase-ai-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14
