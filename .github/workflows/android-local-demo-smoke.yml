name: Android local demo smoke (manual)

# Builds the same dev-debug app without google-services.json, so it uses the
# canonical local Room seed instead of the legacy read-only Firestore preview.
# Captures the canonical two-class / eight-pupil workspace for the demo and
# visual evidence. No Firebase project, credential or live SMS is used.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-demo-smoke:
    name: Canonical local demo on emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Build local-demo APK
        run: |
          test ! -f app/google-services.json
          ./gradlew assembleDevDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch emulator and capture canonical screens
        env:
          TINY_SMOKE_TEST_AUTH: "false"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            cp app/build/outputs/apk/dev/debug/*.apk artifacts/app-dev-debug.apk
            bash tools/android-emulator-smoke.sh artifacts/app-dev-debug.apk

      - name: Upload canonical emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-emulator-canonical
          path: artifacts/emulator
          if-no-files-found: warn
          retention-days: 14
