<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d5b47" />
    <meta name="description" content="Tiny is an offline-first teacher workspace for primary schools. Classes, attendance, lessons, progress and family communication in one calm place." />
    <link rel="icon" type="image/svg+xml" href="/tiny-mark.svg" />
    <script>
      // The web preview uses a dedicated, revocable App Check debug token for
      // Firebase AI Logic. It must be set before the App Check SDK loads.
      const tinyAppCheckDebugToken = '%VITE_FIREBASE_APPCHECK_DEBUG_TOKEN%';
      if (tinyAppCheckDebugToken && !tinyAppCheckDebugToken.includes('%')) {
        self.FIREBASE_APPCHECK_DEBUG_TOKEN = tinyAppCheckDebugToken;
      }
    </script>
    <title>Tiny — teacher workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
